// ─── STATUS & ERROR HELPERS ────────────────────────────────────────────────
function setStatus(apiId, status, text) {
  const el = document.getElementById(`status-${apiId}`);
  if (!el) return;
  let color, icon;
  if (status === 'loading') {
    color = 'status-pill loading'; icon = '<span class="status-dot"></span>';
  } else if (status === 'ok') {
    color = 'status-pill ok'; icon = '<span class="status-dot"></span>';
  } else {
    color = 'status-pill error'; icon = '<span class="status-dot"></span>';
  }
  if (status === 'ok') {
    el.innerHTML = `<span class="${color}" data-api-id="${apiId}" role="button" tabindex="0" title="View cached data" aria-label="View cached data for ${apiId}">${icon}${text}</span>`;
    return;
  }
  el.innerHTML = `<span class="${color}">${icon}${text}</span>`;
}

function showError(apiId, message) {
  const container = document.getElementById(`chartContainer-${apiId}`);
  if (!container) return;
  // Remove any existing error overlay
  const prev = container.querySelector('.error-overlay');
  if (prev) prev.remove();
  const overlay = document.createElement('div');
  overlay.className = 'error-overlay';
  overlay.innerHTML = `<div class="error-icon">⚠️</div><div class="error-text">${message}</div>`;
  container.appendChild(overlay);
}

function getCachedApiResult(apiId) {
  if (!dataCache.results) return null;
  const match = dataCache.results.find(res => res && res.value && res.value.api && res.value.api.id === apiId);
  return match && match.value ? match.value : null;
}

function getAccumulationUnit(apiId) {
  if (!apiId) return 'mm';
  if (apiId.startsWith('open-meteo')) return 'mm';
  if (apiId === 'weatherapi') return 'mm';
  if (apiId === 'wttr') return 'mm';
  if (apiId === 'openweathermap') return 'mm';
  if (apiId === 'noaa') return 'mm';
  return 'mm';
}

function formatCachedDataRows(apiEntry) {
  if (!apiEntry || !apiEntry.data) return null;
  const { api, data } = apiEntry;
  const times = data.times || dataCache.times || [];
  const temp = data.temp || [];
  const pop = data.pop || [];
  const precip = data.precip || [];
  const rowCount = Math.max(times.length, temp.length, pop.length, precip.length);
  const accumulationUnit = getAccumulationUnit(api.id);
  const columns = [
    'Time',
    'Temperature (F)',
    'Precip Chance (%)',
    `Accumulation (${accumulationUnit})`
  ];
  const rows = [];

  for (let i = 0; i < rowCount; i++) {
    const time = times[i] instanceof Date
      ? times[i].toLocaleString('en-US', {
          weekday: 'short',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        })
      : '';
    const tempValue = Number.isFinite(temp[i]) ? temp[i].toFixed(1) : '';
    const popValue = Number.isFinite(pop[i]) ? pop[i].toFixed(0) : '';
    const precipValue = Number.isFinite(precip[i]) ? precip[i].toFixed(2) : '';
    rows.push([time, tempValue, popValue, precipValue]);
  }

  return { columns, rows, accumulationUnit };
}

function getCachedDataText(apiId) {
  const apiEntry = getCachedApiResult(apiId);
  if (!apiEntry) return null;
  const tableData = formatCachedDataRows(apiEntry);
  if (!tableData) return null;
  const lines = [
    apiEntry.api.name,
    tableData.columns.join('\t'),
    ...tableData.rows.map(row => row.join('\t'))
  ];
  return {
    apiName: apiEntry.api.name,
    text: lines.join('\n'),
    tableData
  };
}

function buildCachedDataTable(tableData) {
  if (!tableData) return '<div class="data-modal-empty">No cached weather data is available for this chart yet.</div>';

  const head = tableData.columns.map(col => `<th>${col}</th>`).join('');
  const body = tableData.rows.map(row => `
    <tr>${row.map(value => `<td>${value || ''}</td>`).join('')}</tr>
  `).join('');

  return `
    <div class="data-grid-wrap">
      <table class="data-grid-table">
        <thead>
          <tr>${head}</tr>
        </thead>
        <tbody>
          ${body}
        </tbody>
      </table>
    </div>
  `;
}

async function copyTextToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return;
  }

  const helper = document.createElement('textarea');
  helper.value = text;
  helper.setAttribute('readonly', '');
  helper.style.position = 'fixed';
  helper.style.opacity = '0';
  document.body.appendChild(helper);
  helper.select();
  document.execCommand('copy');
  helper.remove();
}

function openDataModal(apiId) {
  const modal = document.getElementById('dataModal');
  const title = document.getElementById('dataModalTitle');
  const body = document.getElementById('dataModalBody');
  const copyBtn = document.getElementById('copyDataBtn');
  if (!modal || !title || !body || !copyBtn) return;

  const payload = getCachedDataText(apiId);
  if (!payload) {
    title.textContent = 'Cached weather data unavailable';
    body.innerHTML = buildCachedDataTable(null);
    copyBtn.disabled = true;
    delete copyBtn.dataset.clipboardText;
  } else {
    title.textContent = `${payload.apiName} Cached Weather Data`;
    body.innerHTML = buildCachedDataTable(payload.tableData);
    copyBtn.disabled = false;
    copyBtn.dataset.clipboardText = payload.text;
  }

  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}

function closeDataModal() {
  const modal = document.getElementById('dataModal');
  if (!modal) return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
}

function buildCombinedTooltipLines(tooltipItems) {
  const grouped = new Map();

  tooltipItems.forEach(item => {
    const { dataset } = item;
    const apiId = dataset.apiId;
    if (!apiId) return;

    if (!grouped.has(apiId)) {
      grouped.set(apiId, {
        name: dataset.label.replace(/ Precip(?: Chance)?$/, ''),
        temp: '--\u00b0F',
        pop: '--%',
        precip: '-- mm'
      });
    }

    const entry = grouped.get(apiId);
    const value = item.raw;

    if (dataset.yAxisID === 'yTemp') {
      entry.temp = Number.isFinite(value) ? `${Number(value).toFixed(1)}\u00b0F` : '--\u00b0F';
    } else if (dataset.yAxisID === 'yPop') {
      entry.pop = Number.isFinite(value) ? `${Number(value).toFixed(0)}%` : '--%';
    } else if (dataset.yAxisID === 'yPrecip') {
      entry.precip = Number.isFinite(value) ? `${Number(value).toFixed(2)} mm` : '-- mm';
    }
  });

  return Array.from(grouped.values()).map(entry =>
    `${entry.name}: ${entry.temp} | ${entry.pop} | ${entry.precip}`
  );
}

function buildFreezingLinePlugin(yTempRange) {
  return {
    id: 'freezingLine',
    afterDraw(chart) {
      if (!yTempRange || yTempRange[0] == null || yTempRange[0] >= 32) return;
      const yScale = chart.scales.yTemp;
      const chartArea = chart.chartArea;
      if (!yScale || !chartArea) return;

      const y = yScale.getPixelForValue(32);
      if (y < chartArea.top || y > chartArea.bottom) return;

      const { ctx } = chart;
      ctx.save();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.85)';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y);
      ctx.lineTo(chartArea.right, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(148, 163, 184, 0.95)';
      ctx.font = '9px Space Mono, monospace';
      ctx.textAlign = 'left';
      ctx.fillText('32°F', chartArea.left + 6, y - 6);
      ctx.restore();
    }
  };
}

function formatRelativeAge(ms) {
  if (!Number.isFinite(ms) || ms < 0) return 'unavailable';
  const totalMinutes = Math.floor(ms / 60000);
  if (totalMinutes <= 0) return 'just updated';
  if (totalMinutes < 60) return `${totalMinutes}m ago`;
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  if (hours < 24) return minutes ? `${hours}h ${minutes}m ago` : `${hours}h ago`;
  const days = Math.floor(hours / 24);
  const remHours = hours % 24;
  return remHours ? `${days}d ${remHours}h ago` : `${days}d ago`;
}

function getForecastAgeText(freshness) {
  if (!freshness || !freshness.supported) return 'Forecast age: unavailable';
  if (!Number.isFinite(freshness.availableAtMs)) return 'Forecast age: unavailable';
  const ageMs = Date.now() - freshness.availableAtMs;
  return `Forecast age: ${formatRelativeAge(ageMs)}`;
}

function setForecastAge(apiId, freshness) {
  const el = document.getElementById(`forecast-age-${apiId}`);
  if (!el) return;
  el.textContent = getForecastAgeText(freshness);
}

async function fetchOpenMeteoMetadata(model) {
  const openMeteoMetaIds = {
    gfs: 'ncep_gfs013',
    icon: 'dwd_icon',
    ecmwf: 'ecmwf_ifs',
    gem: 'cmc_gem_gdps',
    jma: 'jma_gsm',
    meteofrance: 'meteofrance_arpege_world025',
    dwd: 'dwd_icon',
    ukmo: 'ukmo_global_deterministic_10km'
  };

  const metaId = openMeteoMetaIds[model];
  if (!metaId) {
    return { supported: false, source: 'unavailable' };
  }

  try {
    const url = `https://api.open-meteo.com/data/${metaId}/static/meta.json?cache_buster=${Date.now()}`;
    const response = await fetch(url);
    if (!response.ok) {
      return { supported: false, source: 'unavailable' };
    }

    const payload = await response.json();
    const availabilitySeconds = payload?.last_run_availability_time;
    if (!Number.isFinite(availabilitySeconds)) {
      return { supported: false, source: 'unavailable' };
    }

    return {
      supported: true,
      source: 'open-meteo-availability',
      availableAtMs: availabilitySeconds * 1000
    };
  } catch (error) {
    return { supported: false, source: 'unavailable' };
  }
}

// ─── GEOCODE VIA NOMINATIM (no key needed) ─────────────────────────────────
async function geocode(query) {
  // If the query looks like a US zip code (5 digits), append ', USA' to bias geocoding
  let q = query;
  if (/^\d{5}$/.test(query)) {
    q = query + ', USA';
  }
  const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`;
  const r = await fetch(url, { headers: { 'Accept-Language': 'en' } });
  const data = await r.json();
  if (!data.length) throw new Error('Location not found');
  // Extract city/town name and state/province from Nominatim's detailed address
  const result = data[0];
  const address = result.address || {};
  const name = address.city || address.town || address.village || result.display_name.split(',')[0];
  // Try to get state from address.state first; if not available, parse from display_name
  let state = address.state || '';
  if (!state && result.display_name) {
    const parts = result.display_name.split(',').map(p => p.trim());
    // For US locations, state is usually 2 parts from the end (e.g., "..., Maine, United States")
    if (parts.length > 2) {
      const maybeState = parts[parts.length - 2];
      // Check if it looks like a US state name (not a country or county)
      if (maybeState && !['United States', 'USA', 'County'].some(x => maybeState.includes(x))) {
        state = maybeState;
      }
    }
  }
  return { lat: parseFloat(result.lat), lon: parseFloat(result.lon), name, state };
}

// ─── OPEN-METEO ─────────────────────────────────────────────────────────────
async function fetchOpenMeteo(geo) {
  // Accept model as second argument
  let model = arguments[1] || 'auto';
  let modelParam = model && model !== 'auto' ? `&model=${model}` : '';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&hourly=temperature_2m,precipitation_probability,precipitation&temperature_unit=fahrenheit&forecast_days=3&timezone=auto${modelParam}`;
  const [forecastRes, freshness] = await Promise.all([
    fetch(url),
    fetchOpenMeteoMetadata(model)
  ]);
  if (!forecastRes.ok) throw new Error(`Open-Meteo error ${forecastRes.status}`);
  const d = await forecastRes.json();
  return {
    data: parseOpenMeteo(d),
    freshness
  };
}

function parseOpenMeteo(d) {
  const times = d.hourly.time.map(t => new Date(t));
  return {
    times,
    temp:   d.hourly.temperature_2m,
    pop:    d.hourly.precipitation_probability,
    precip: d.hourly.precipitation,
    timezone: d.timezone
  };
}

// ─── OPENWEATHERMAP ─────────────────────────────────────────────────────────
async function fetchOWM(geo) {
  // Use a CORS proxy since OWM doesn't allow direct browser calls in all contexts
  const url = `https://api.openweathermap.org/data/2.5/forecast?lat=${geo.lat}&lon=${geo.lon}&appid=${OWM_KEY}&units=imperial&cnt=72`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`OWM error ${r.status}`);
  const d = await r.json();
  return {
    data: parseOWM(d),
    freshness: { supported: false, source: 'unavailable' }
  };
}

function parseOWM(d) {
  // Limit to 72 data points (3 days, 3-hour intervals)
  const limit = 72;
  const times  = d.list.slice(0, limit).map(x => new Date(x.dt * 1000));
  const temp   = d.list.slice(0, limit).map(x => x.main.temp);
  const pop    = d.list.slice(0, limit).map(x => (x.pop || 0) * 100);
  const precip = d.list.slice(0, limit).map(x => (x.rain && x.rain['3h']) ? x.rain['3h'] : 0);
  return { times, temp, pop, precip };
}

// ─── WEATHERAPI.COM ─────────────────────────────────────────────────────────
async function fetchWeatherAPI(geo) {
  if (!window.WEATHERAPI_KEY || window.WEATHERAPI_KEY === 'YOUR_WEATHERAPI_KEY_HERE') {
    throw new Error('WeatherAPI.com key missing. Please create config.js and add your free API key.');
  }
  const url = `https://api.weatherapi.com/v1/forecast.json?key=${window.WEATHERAPI_KEY}&q=${geo.lat},${geo.lon}&days=3&aqi=no&alerts=no`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`WeatherAPI error ${r.status}`);
  const d = await r.json();
  return {
    data: parseWeatherAPI(d),
    freshness: { supported: false, source: 'unavailable' }
  };
}

function parseWeatherAPI(d) {
  const times = [], temp = [], pop = [], precip = [];
  for (const day of d.forecast.forecastday) {
    // ── IMPORTANT: WeatherAPI precip_mm is cumulative, not per-hour ──────────
    //
    // Unlike Open-Meteo (which reports precipitation as a "preceding hour sum")
    // or NWS (which also reports per-period amounts), WeatherAPI's hourly
    // forecast field `precip_mm` is a running total that accumulates from
    // midnight of each forecast day and resets to 0 at the start of each new
    // calendar day. This is confirmed by the WeatherAPI community forum:
    //   https://community.weatherapi.com/t/precip-mm-is-cumulative/1580
    //
    // Example of the raw WeatherAPI values for a rainy morning (1 mm/hr):
    //   00:00 → precip_mm = 0.0   (no rain yet)
    //   01:00 → precip_mm = 1.0   (1 mm fell in hour 1)
    //   02:00 → precip_mm = 2.0   (1 mm more fell, cumulative = 2)
    //   03:00 → precip_mm = 2.0   (rain stopped, cumulative unchanged)
    //
    // Naively using the raw value would show 2 mm at 02:00 instead of 1 mm,
    // making WeatherAPI appear to report ~2x more precipitation than other APIs
    // on any multi-hour rain event.
    //
    // Fix: compute per-hour precipitation by differencing consecutive cumulative
    // values within the day. prevPrecip resets to 0 at the outer loop (new day)
    // so the first hour of each day is treated as its full value (not subtracted
    // from the prior day's total). Math.max(0, ...) guards against any rare
    // floating-point artifacts that could yield a tiny negative difference.
    let prevPrecip = 0;
    for (const h of day.hour) {
      times.push(new Date(h.time));
      temp.push(h.temp_f);
      pop.push(h.chance_of_rain);
      const hourlyPrecip = Math.max(0, h.precip_mm - prevPrecip);
      prevPrecip = h.precip_mm;
      precip.push(hourlyPrecip);
    }
  }
  return { times, temp, pop, precip };
}

// ─── WTTR.IN ─────────────────────────────────────────────────────────────────
async function fetchWttr(geo) {
  const url = `https://wttr.in/${geo.lat},${geo.lon}?format=j1`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`wttr.in error ${r.status}`);
  const d = await r.json();
  return {
    data: parseWttr(d),
    freshness: { supported: false, source: 'unavailable' }
  };
}

function parseWttr(d) {
  const times = [], temp = [], pop = [], precip = [];
  const now = new Date();
  now.setMinutes(0, 0, 0);
  for (let di = 0; di < Math.min(d.weather.length, 3); di++) {
    const day = d.weather[di];
    const base = new Date(day.date + 'T00:00:00');
    const hourly = day.hourly;
    // wttr.in gives 3-hourly data, interpolate
    for (let h = 0; h < 24; h++) {
      const slot = Math.floor(h / 3);
      const slotCapped = Math.min(slot, hourly.length - 1);
      const slotNext   = Math.min(slot + 1, hourly.length - 1);
      const frac = (h % 3) / 3;
      const lerp = (a, b) => a + (b - a) * frac;
      const hw = hourly[slotCapped], hwN = hourly[slotNext];
      const t = new Date(base); t.setHours(h);
      times.push(t);
      const tf = parseFloat(hw.tempF) + (parseFloat(hwN.tempF) - parseFloat(hw.tempF)) * frac;
      temp.push(tf);
      pop.push(parseFloat(hw.chanceofrain));
      precip.push(parseFloat(hw.precipMM) / 3);
    }
  }
  return { times, temp, pop, precip };
}

// ─── NOAA / NWS ──────────────────────────────────────────────────────────────
// Two-step: (1) /points/{lat},{lon} → gridpoint URL, (2) /gridpoints/.../forecast/hourly
async function fetchNOAA(geo) {
  const ptUrl = `https://api.weather.gov/points/${geo.lat.toFixed(4)},${geo.lon.toFixed(4)}`;
  const ptRes = await fetch(ptUrl, { headers: { 'User-Agent': 'SkyDiff/1.0 weather-compare-tool' } });
  if (!ptRes.ok) {
    if (ptRes.status === 404 || ptRes.status === 301) throw new Error('Location outside US coverage (NWS is US-only)');
    throw new Error(`NWS points error ${ptRes.status}`);
  }
  const ptData = await ptRes.json();
  const hourlyUrl = ptData.properties && ptData.properties.forecastHourly;
  if (!hourlyUrl) throw new Error('NWS did not return a forecast URL');

  const fcRes = await fetch(hourlyUrl, { headers: { 'User-Agent': 'SkyDiff/1.0 weather-compare-tool' } });
  if (!fcRes.ok) {
    if (fcRes.status === 404) throw new Error('Hourly forecast not available for this US location.');
    throw new Error(`NWS forecast error ${fcRes.status}`);
  }
  const fcData = await fcRes.json();
  return {
    data: parseNOAA(fcData),
    freshness: { supported: false, source: 'unavailable' }
  };
}

function parseNOAA(d) {
  const periods = d.properties.periods.slice(0, 72);
  const times   = periods.map(p => new Date(p.startTime));
  const temp    = periods.map(p =>
    p.temperatureUnit === 'F' ? p.temperature : p.temperature * 9/5 + 32
  );
  const pop = periods.map(p => {
    const v = p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value;
    return v != null ? v : 0;
  });
  const precip = periods.map(p => {
    const v = p.quantitativePrecipitation && p.quantitativePrecipitation.value;
    return v != null ? v : 0;
  });
  return { times, temp, pop, precip };
}

// ─── CHART RENDERING ─────────────────────────────────────────────────────────
const chartInstances = {};

// Store all temperature arrays for global min/max calculation
let allTempsGlobal = [];

function celsiusToF(c) { return c * 9/5 + 32; }

function getGlobalTempRange() {
  if (!allTempsGlobal.length) return [null, null];
  let min = Math.min(...allTempsGlobal.flat());
  let max = Math.max(...allTempsGlobal.flat());
  return [Math.floor(min) - 5, Math.ceil(max) + 5];
}

function resetGlobalTemps() {
  allTempsGlobal = [];
}

function addToGlobalTemps(tempArr) {
  allTempsGlobal.push(tempArr);
}

// ─── HELPER: Detect if current theme is light ─────────────────────────────────
function isLightTheme() {
  const lightThemes = ['dawn', 'aqua', 'sage', 'peach', 'lavender', 'cartoon'];
  const currentTheme = document.body.className.replace('scheme-', '') || 'midnight';
  return lightThemes.includes(currentTheme);
}

function buildDayNightPlugin(times) {
  return {
    id: 'daynight',
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea || !times.length) return;
      const { left, right, top, bottom } = chartArea;
      const xScale = scales.x;
      const w = right - left;
      const totalHours = times.length;
      const light = isLightTheme();

      times.forEach((t, i) => {
        const h = t.getHours() + t.getMinutes() / 60;
        // Determine sky color based on hour and theme
        let color;
        if (light) {
          // Light theme colors - subtle, 50% lighter background
          if (h >= 5.5 && h < 7.5) {
            // Dawn - soft yellow
            const p = (h - 5.5) / 2;
            color = `rgba(253,230,138,${0.10 - p * 0.05})`;
          } else if (h >= 7.5 && h < 18) {
            // Day - very subtle light blue
            color = 'rgba(186,230,253,0.04)';
          } else if (h >= 18 && h < 20) {
            // Dusk - soft purple
            const p = (h - 18) / 2;
            color = `rgba(124,58,237,${0.0375 + p * 0.075})`;
          } else {
            // Night - light gray
            color = 'rgba(100,116,139,0.15)';
          }
        } else {
          // Dark theme colors (original)
          if (h >= 5.5 && h < 7.5) {
            // Dawn
            const p = (h - 5.5) / 2;
            color = `rgba(253,230,138,${0.225 - p * 0.15})`;
          } else if (h >= 7.5 && h < 18) {
            // Day
            color = 'rgba(186,230,253,0.08)';
          } else if (h >= 18 && h < 20) {
            // Dusk
            const p = (h - 18) / 2;
            color = `rgba(124,58,237,${0.0625 + p * 0.275})`;
          } else {
            // Night
            color = 'rgba(15,23,42,0.69)';
          }
        }

        const xFrac = i / (totalHours - 1);
        const xNextFrac = (i + 1) / (totalHours - 1);
        const x1 = left + xFrac * w;
        const x2 = Math.min(left + xNextFrac * w, right);
        ctx.fillStyle = color;
        ctx.fillRect(x1, top, x2 - x1, bottom - top);
      });
    }
  };
}

function buildMidnightPlugin(times) {
  return {
    id: 'midnight',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const { left, right, top, bottom } = chartArea;
      const w = right - left;
      const total = times.length;

      times.forEach((t, i) => {
        if (t.getHours() === 0 && t.getMinutes() === 0 && i > 0) {
          const xFrac = i / (total - 1);
          const x = left + xFrac * w;
          ctx.save();
          ctx.strokeStyle = 'rgba(148,163,184,0.8)';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
          ctx.stroke();
          // Label
          const label = t.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
          ctx.fillStyle = 'rgba(148,163,184,0.9)';
          ctx.font = '9px Space Mono, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(label, x, top - 4);
          ctx.restore();
        }
      });
    }
  };
}

function buildNoonWeekdayPlugin(times) {
  return {
    id: 'noonWeekday',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea || !times.length) return;
      
      const bodyFont = getComputedStyle(document.body).fontFamily;
      const { left, right, top } = chartArea;
      const w = right - left;
      const total = times.length;

      times.forEach((t, i) => {
        if (t.getHours() !== 12 || t.getMinutes() !== 0) return;

        // Calculate pixel position based on data point position
        const xFrac = total > 1 ? i / (total - 1) : 0;
        const x = left + xFrac * w;

        ctx.save();
        ctx.fillStyle = 'rgba(100,150,200,0.85)';
        ctx.font = `bold 12px ${bodyFont}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(
          t.toLocaleDateString('en-US', { weekday: 'short' }),
          x,
          top - 6
        );
        ctx.restore();
      });
    }
  };
}

function buildMinMaxPlugin(times, temps) {
  return {
    id: 'minmax',
    afterDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!chartArea || !temps.length) return;
      const { left, right, top, bottom } = chartArea;
      const w = right - left;
      const total = times.length;
      const yScale = scales.yTemp;

      // Group by day
      const dayMap = {};
      times.forEach((t, i) => {
        const key = t.toDateString();
        if (!dayMap[key]) dayMap[key] = [];
        dayMap[key].push({ i, val: temps[i] });
      });

      Object.values(dayMap).forEach(pts => {
        if (!pts.length) return;
        const maxPt = pts.reduce((a, b) => a.val > b.val ? a : b);
        const minPt = pts.reduce((a, b) => a.val < b.val ? a : b);

        [maxPt, minPt].forEach(pt => {
          const isMax = pt === maxPt;
          const xFrac = pt.i / (total - 1);
          const x = left + xFrac * w;
          const y = yScale.getPixelForValue(pt.val);

          // Circle
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fillStyle = isMax ? '#fb923c' : '#38bdf8';
          ctx.fill();
          ctx.strokeStyle = '#0a0e1a';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Label
          const label = Math.round(pt.val) + '°';
          ctx.font = 'bold 9px Syne, sans-serif';
          ctx.fillStyle = isMax ? '#fb923c' : '#38bdf8';
          ctx.textAlign = 'center';
          ctx.fillText(label, x, isMax ? y - 8 : y + 15);
          ctx.restore();
        });
      });
    }
  };
}

// ─── ALIGN DATA TO COMMON TIME AXIS ───────────────────────────────────────
function alignDataToTimes(data, targetTimes) {
  const { times: sourceTimes, temp, pop, precip } = data;
  
  // Create interpolation function
  const interpolate = (sourceData) => {
    return targetTimes.map(targetTime => {
      // Find the two nearest source points
      let idx = sourceTimes.findIndex(t => t >= targetTime);
      
      if (idx === -1) {
        // Target time is after all source times, use last value
        return sourceData[sourceData.length - 1];
      }
      if (idx === 0 && targetTime < sourceTimes[0]) {
        // Target time is before all source times, use first value
        return sourceData[0];
      }
      
      // Exact match or interpolate
      if (sourceTimes[idx].getTime() === targetTime.getTime()) {
        return sourceData[idx];
      }
      
      // Linear interpolation
      const prevIdx = idx - 1;
      const nextIdx = idx;
      const prevTime = sourceTimes[prevIdx];
      const nextTime = sourceTimes[nextIdx];
      const prevVal = sourceData[prevIdx];
      const nextVal = sourceData[nextIdx];
      
      const totalDiff = nextTime.getTime() - prevTime.getTime();
      const targetDiff = targetTime.getTime() - prevTime.getTime();
      const fraction = targetDiff / totalDiff;
      
      return prevVal + (nextVal - prevVal) * fraction;
    });
  };
  
  return {
    times: targetTimes,
    temp: interpolate(temp),
    pop: interpolate(pop),
    precip: interpolate(precip)
  };
}

      const h = t.getHours();

  chartInstances[apiId] = new Chart(ctx, {

// ─── COMBINED CHART RENDERING ─────────────────────────────────────────────────
let combinedChartInstance = null;
const combinedHiddenSources = new Set();

function syncCombinedLegendState() {
  const legend = document.getElementById('combinedLegend');
  if (!legend) return;

  legend.querySelectorAll('.legend-item[data-api-id]').forEach(item => {
    const isHidden = combinedHiddenSources.has(item.dataset.apiId);
    item.classList.toggle('is-hidden', isHidden);
    item.setAttribute('aria-pressed', String(!isHidden));
    item.title = isHidden ? 'Click to show this model' : 'Click to hide this model';
  });
}

function setupCombinedLegendInteractions() {
  const legend = document.getElementById('combinedLegend');
  if (!legend) return;

  const toggleLegendItem = (item) => {
    if (!item || !combinedChartInstance) return;

    const { apiId } = item.dataset;
    const shouldHide = !combinedHiddenSources.has(apiId);

    combinedChartInstance.data.datasets.forEach((dataset, index) => {
      if (dataset.apiId === apiId) {
        combinedChartInstance.setDatasetVisibility(index, !shouldHide);
      }
    });

    if (shouldHide) {
      combinedHiddenSources.add(apiId);
    } else {
      combinedHiddenSources.delete(apiId);
    }

    combinedChartInstance.update();
    syncCombinedLegendState();
  };

  legend.onclick = (event) => {
    toggleLegendItem(event.target.closest('.legend-item[data-api-id]'));
  };

  legend.onkeydown = (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const item = event.target.closest('.legend-item[data-api-id]');
    if (!item) return;
    event.preventDefault();
    toggleLegendItem(item);
  };

  syncCombinedLegendState();
}


function renderCombinedChart(checkedSources, yTempRange, forcedTimes) {
  const canvas = document.getElementById('combinedChart');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  // Get CSS variable values from body where they're actually defined
  const bodyStyles = getComputedStyle(document.body);
  const textSecondary = bodyStyles.getPropertyValue('--text-secondary').trim() || bodyStyles.color;
  // Get font-family from body (same as geo-info)
  const bodyFont = bodyStyles.fontFamily;

  // Build datasets from cached results for selected APIs
  const datasets = [];
  const legendHTML = [];
  const labels = forcedTimes.map((t, i) => {
    if (i % 6 === 0) {
      const h = t.getHours();
      return h === 0 ? '12a' : h < 12 ? `${h}a` : h === 12 ? '12p' : `${h-12}p`;
    }
    return '';
  });

  // Add temperature lines, precipitation bars, and precipitation chance lines for each selected API
  dataCache.results.forEach(res => {
    if (res && res.value && res.value.data && res.value.api) {
      const { api, data } = res.value;
      if (checkedSources.includes(api.id)) {
        // Temperature line
        datasets.push({
          type: 'line',
          label: api.name,
          apiId: api.id,
          data: data.temp,
          borderColor: api.color,
          backgroundColor: 'transparent',
          borderWidth: 2.5,
          pointRadius: 0,
          tension: 0.3,
          yAxisID: 'yTemp',
          fill: false,
          order: 1
        });
        // Precipitation bars (if available)
        if (data.precip) {
          datasets.push({
            type: 'bar',
            label: api.name + ' Precip',
            apiId: api.id,
            data: data.precip,
            backgroundColor: api.color + '55', // semi-transparent
            borderColor: api.color,
            borderWidth: 1,
            yAxisID: 'yPrecip',
            barPercentage: 0.7,
            categoryPercentage: 0.9,
            order: 0
          });
        }
        // Precipitation chance line (if available)
        if (data.pop) {
          datasets.push({
            type: 'line',
            label: api.name + ' Precip Chance',
            apiId: api.id,
            data: data.pop,
            borderColor: api.color,
            backgroundColor: 'rgba(167,139,250,0.0)',
            borderWidth: 1.5,
            pointRadius: 0,
            tension: 0.3,
            fill: false,
            yAxisID: 'yPop',
            borderDash: [3, 2],
            order: 2
          });
        }
        // Add to legend
        legendHTML.push(`
          <div class=\"legend-item\" data-api-id=\"${api.id}\" role=\"button\" tabindex=\"0\" aria-pressed=\"true\">\n            <div class=\"legend-color\" style=\"background-color: ${api.color}; width: 24px;\"></div>\n            <span>${api.name}</span>\n          </div>\n        `);
      }
    }
  });

  // Update legend display
  document.getElementById('combinedLegend').innerHTML = legendHTML.join('');

  // Destroy existing chart if exists
  if (combinedChartInstance) {
    combinedChartInstance.destroy();
  }

  // Plugins
  const dayNightPlugin = buildDayNightPlugin(forcedTimes);
  const midnightPlugin = buildMidnightPlugin(forcedTimes);
  const noonWeekdayPlugin = buildNoonWeekdayPlugin(forcedTimes);

  // Custom grid plugin for 4-hour vertical bars
  const fourHourGridPlugin = {
    id: 'fourHourGrid',
    beforeDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      if (!scales.x) return;
      ctx.save();
      ctx.globalAlpha = 0.18;
      for (let i = 0; i < scales.x.ticks.length; i++) {
        if (i % 4 === 0) {
          const x = scales.x.getPixelForTick(i);
          ctx.beginPath();
          ctx.moveTo(x, chartArea.top);
          ctx.lineTo(x, chartArea.bottom);
          ctx.strokeStyle = '#64748b';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([]);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  };

  combinedChartInstance = new Chart(ctx, {
    type: 'bar', // base type for bar+line
    data: {
      labels,
      datasets
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 400 },
      interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 20, left: 4, right: 4, bottom: 0 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(17,24,39,0.95)',
          borderColor: '#1e2d45',
          borderWidth: 1,
          titleColor: '#94a3b8',
          bodyColor: '#e2e8f0',
          padding: 10,
          titleFont: { family: bodyFont, size: 9 },
          bodyFont: { family: bodyFont, size: 10 },
          displayColors: false,
          callbacks: {
            title(items) {
              const i = items[0].dataIndex;
              const t = forcedTimes[i];
              return t.toLocaleString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric' });
            },
            label(item) {
              // Only emit one line per API — from the yTemp dataset
              if (item.dataset.yAxisID !== 'yTemp') return null;
              const allItems = item.chart.tooltip.dataPoints;
              const apiId = item.dataset.apiId;
              const tempItem   = allItems.find(d => d.dataset.apiId === apiId && d.dataset.yAxisID === 'yTemp');
              const popItem    = allItems.find(d => d.dataset.apiId === apiId && d.dataset.yAxisID === 'yPop');
              const precipItem = allItems.find(d => d.dataset.apiId === apiId && d.dataset.yAxisID === 'yPrecip');
              const name   = item.dataset.label;
              const temp   = tempItem   && Number.isFinite(tempItem.raw)   ? `${Number(tempItem.raw).toFixed(1)}°F`    : '--°F';
              const pop    = popItem    && Number.isFinite(popItem.raw)    ? `${Number(popItem.raw).toFixed(0)}%`      : '--%';
              const precip = precipItem && Number.isFinite(precipItem.raw) ? `${Number(precipItem.raw).toFixed(2)} mm` : '-- mm';
              return `${name}: ${temp} | ${pop} | ${precip}`;
            },
            labelTextColor(item) {
              if (item.dataset.yAxisID === 'yTemp') {
                return item.dataset.borderColor || '#e2e8f0';
              }
              return 'transparent';
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false }, // Hide default grid
          border: { color: '#1e2d45' },
          ticks: {
            color: '#64748b',
            font: { family: bodyFont, size: 8 },
            maxRotation: 0,
            autoSkip: false,
            padding: 4
          }
        },
        yTemp: {
          position: 'left',
          grid: { color: 'rgba(30,45,69,0.13)' },
          border: { color: '#1e2d45', dash: [2, 2] },
          min: yTempRange && yTempRange[0] != null ? yTempRange[0] : undefined,
          max: yTempRange && yTempRange[1] != null ? yTempRange[1] : undefined,
          ticks: {
            color: textSecondary,
            font: { family: bodyFont, size: 16 },
            callback: v => `${Math.round(v)}°`,
            maxTicksLimit: 8,
            padding: 4
          }
        },
        yPop: {
          display: false,
          min: 0,
          max: 100
        },
        yPrecip: {
          position: 'right',
          grid: { display: false },
          border: { color: '#1e2d45' },
          min: 0,
          ticks: {
            color: textSecondary,
            font: { family: bodyFont, size: 12 },
            callback: v => v > 0 ? v.toFixed(2) : '',
            maxTicksLimit: 5,
            padding: 4
          }
        }
      }
    },
    plugins: [dayNightPlugin, midnightPlugin, noonWeekdayPlugin, fourHourGridPlugin]
  });

  combinedChartInstance.data.datasets.forEach((dataset, index) => {
    if (combinedHiddenSources.has(dataset.apiId)) {
      combinedChartInstance.setDatasetVisibility(index, false);
    }
  });
  combinedChartInstance.update();
  setupCombinedLegendInteractions();
  // Hide loading overlay when combined chart finishes rendering
  hideOverlay('combined');
}

// ─── THEME MANAGEMENT ──────────────────────────────────────────────────────
const themes = [
  { name: 'midnight', label: '🎨 Midnight', emoji: '🌙' },
  { name: 'ocean', label: '🌊 Ocean', emoji: '💙' },
  { name: 'forest', label: '🌲 Forest', emoji: '💚' },
  { name: 'sunset', label: '🌅 Sunset', emoji: '🧡' },
  { name: 'cartoon', label: '🎬 Cartoon', emoji: '🎞️' },
  { name: 'cosmic', label: '✨ Cosmic', emoji: '💜' },
  { name: 'dawn', label: '☀️ Dawn', emoji: '🩵' },
  { name: 'aqua', label: '💎 Aqua', emoji: '🌊' },
  { name: 'sage', label: '🍃 Sage', emoji: '💚' },
  { name: 'peach', label: '🍑 Peach', emoji: '🧡' },
  { name: 'lavender', label: '💜 Lavender', emoji: '🦋' }
];

let currentThemeIndex = themes.findIndex(t => t.name === 'cartoon');
if (currentThemeIndex === -1) currentThemeIndex = 0;

function initTheme() {
  const savedTheme = localStorage.getItem('theme-scheme');
  if (savedTheme) {
    currentThemeIndex = themes.findIndex(t => t.name === savedTheme);
    if (currentThemeIndex === -1) currentThemeIndex = themes.findIndex(t => t.name === 'cartoon');
  }
  if (currentThemeIndex === -1) currentThemeIndex = 0;
  applyTheme(currentThemeIndex);
}

function applyTheme(index) {
  const theme = themes[index];
  document.body.className = theme.name === 'midnight' ? '' : `scheme-${theme.name}`;
  localStorage.setItem('theme-scheme', theme.name);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme.label;
  
  // Re-render combined chart if it exists with current data
  if (combinedChartInstance && dataCache.results && dataCache.yTempRange && dataCache.times) {
    const checkedSources = Array.from(document.querySelectorAll('.slicer-toggle.active')).map(el => el.dataset.value);
    if (checkedSources.length > 0) {
      renderCombinedChart(checkedSources, dataCache.yTempRange, dataCache.times);
    }
  }
}

function cycleTheme() {
  currentThemeIndex = (currentThemeIndex + 1) % themes.length;
  applyTheme(currentThemeIndex);
}

// ─── VERSION INFO ──────────────────────────────────────────────────────────
function loadVersionInfo() {
  fetch('version.txt')
    .then(r => r.text())
    .then(text => {
      const lines = text.trim().split('\n');
      const versionMatch = lines.find(l => l.startsWith('version='));
      const dateMatch = lines.find(l => l.startsWith('lastUpdated='));
      
      if (versionMatch && dateMatch) {
        const version = versionMatch.split('=')[1];
        const dateStr = dateMatch.split('=')[1];
        const date = new Date(dateStr);
        const formatted = date.toLocaleString('en-US', { 
          month: 'short', 
          day: 'numeric', 
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
        document.getElementById('version-info').textContent = `Version ${version} | Last Updated: ${formatted}`;
      }
    })
    .catch(() => {
      document.getElementById('version-info').textContent = 'Version: unknown';
    });
}

// ─── PROGRESS BAR MANAGEMENT ──────────────────────────────────────────────────
let progressTimer = null;
let progressWidth = 0;

function showProgressBar() {
  const bar = document.getElementById('progressBar');
  bar.classList.add('active');
  progressWidth = 10;
  bar.style.width = progressWidth + '%';
  
  // Animate progress bar incrementally
  progressTimer = setInterval(() => {
    progressWidth += Math.random() * 20;
    if (progressWidth > 90) progressWidth = 90;
    bar.style.width = progressWidth + '%';
  }, 200);
}

function completeProgressBar() {
  const bar = document.getElementById('progressBar');
  clearInterval(progressTimer);
  bar.style.width = '100%';
  
  // Hide after animation completes
  setTimeout(() => {
    bar.classList.remove('active');
    bar.style.width = '0%';
  }, 300);
}

// ─── DATA CACHE ──────────────────────────────────────────────────────────────
const dataCache = {
  location: null,
  geo: null,
  times: null,
  results: null,
  yTempRange: null,
  timestamp: null,
  CACHE_TTL_MS: 10 * 60 * 1000  // 10 minutes
};

function isCacheValid(location) {
  if (!dataCache.results) return false;
  if (dataCache.location !== location) return false;
  const elapsed = Date.now() - dataCache.timestamp;
  return elapsed < dataCache.CACHE_TTL_MS;
}

// ─── FETCH WEATHER DATA ──────────────────────────────────────────────────────
async function fetchWeatherData(geo, times) {
  const apiList = APIS;  // Fetch for ALL APIs, not just selected ones
  const results = await Promise.allSettled(
    apiList.map(async api => {
      try {
        const payload = await api.fetch(geo);
        let data = payload.data || payload;
        const freshness = payload.freshness || { supported: false, source: 'unavailable' };
        // Align data to common times
        data = alignDataToTimes(data, times);
        addToGlobalTemps(data.temp);
        return { api, data, freshness };
      } catch (e) {
        setStatus(api.id, 'error', 'error');
        setForecastAge(api.id, { supported: false, source: 'unavailable' });
        showError(api.id, `${api.name} failed: ${e.message}`);
        return null;
      }
    })
  );
  return results;
}

// ─── RENDER CHARTS FROM CACHE ────────────────────────────────────────────────
function renderChartsFromCache() {
  const btn = document.getElementById('fetchBtn');
  const grid = document.getElementById('mainGrid');
  
  // Get selected sources/models
  const checkedSources = Array.from(document.querySelectorAll('.slicer-toggle.active')).map(btn => btn.getAttribute('data-value'));

  // Clear grid
  grid.innerHTML = '';
  Object.keys(chartInstances).forEach(k => {
    if (chartInstances[k]) { chartInstances[k].destroy(); delete chartInstances[k]; }
  });

  // Reset global temps
  resetGlobalTemps();

  // Create cards for selected sources only
  APIS.filter(api => checkedSources.includes(api.id)).forEach(api => createCard(api));

  // Render charts from cache
  dataCache.results.forEach(res => {
    if (res && res.value && res.value.data) {
      const { api, data, freshness } = res.value;
      // Only render if this API is in the selected sources
      if (checkedSources.includes(api.id)) {
        hideOverlay(api.id);
        renderChart(api.id, data, dataCache.yTempRange, dataCache.times);
        setForecastAge(api.id, freshness);
        setStatus(api.id, 'ok', 'cached data');
      }
    }
  });

  // Render combined chart
  if (checkedSources.length > 0) {
    renderCombinedChart(checkedSources, dataCache.yTempRange, dataCache.times);
  }

  btn.disabled = false;
  btn.textContent = 'Fetch Forecasts';
}

// ─── LOAD ALL ────────────────────────────────────────────────────────────────
async function loadAll(forceRefresh = false) {
  const btn = document.getElementById('fetchBtn');
  const cityInput = document.getElementById('cityInput');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  
  // Show progress bar
  showProgressBar();

  let geoInput = cityInput.value.trim() || '15108';
  
  // Check if we can use cache
  if (!forceRefresh && isCacheValid(geoInput)) {
    // Use cached data without refetching
    renderChartsFromCache();
    completeProgressBar();
    return;
  }

  // Get selected sources/models
  const checkedSources = Array.from(document.querySelectorAll('.slicer-toggle.active')).map(btn => btn.getAttribute('data-value'));

  // Clear grid
  const grid = document.getElementById('mainGrid');
  grid.innerHTML = '';
  Object.keys(chartInstances).forEach(k => {
    if (chartInstances[k]) { chartInstances[k].destroy(); delete chartInstances[k]; }
  });

  // Reset global temps
  resetGlobalTemps();

  // Create cards for selected sources only
  APIS.filter(api => checkedSources.includes(api.id)).forEach(api => createCard(api));

  // Geocode
  let geo;
  try {
    geo = await geocode(geoInput);
    // Show geocode info at bottom, including state if available
    const geoInfo = document.getElementById('geo-info');
    if (geoInfo) {
      const locationStr = geo.state ? `${geo.name}, ${geo.state}` : geo.name || geoInput;
      const coordsText = `Lat: ${geo.lat.toFixed(4)}, Lon: ${geo.lon.toFixed(4)}`;
      geoInfo.textContent = locationStr ? `Location: ${locationStr}\n${coordsText}` : coordsText;
    }
    // Show combined chart loading overlay
    const combinedOverlay = document.getElementById('overlay-combined');
    if (combinedOverlay) {
      combinedOverlay.classList.remove('hidden');
    }
  } catch (e) {
    const geoInfo = document.getElementById('geo-info');
    if (geoInfo) geoInfo.textContent = '';
    APIS.forEach(api => {
      setStatus(api.id, 'error', 'geo error');
      setForecastAge(api.id, { supported: false, source: 'unavailable' });
      showError(api.id, 'Could not geocode location: ' + e.message);
    });
    btn.disabled = false;
    btn.textContent = 'Fetch Forecasts';
    completeProgressBar();
    return;
  }

  // Build common time axis: from 4 hours ago to 72 hours ahead, hourly
  const now = new Date();
  now.setMinutes(0, 0, 0); // Snap to current hour so all times are on the hour
  const start = new Date(now.getTime() - 4 * 60 * 60 * 1000);
  const times = [];
  for (let i = 0; i < 72; i++) {
    times.push(new Date(start.getTime() + i * 60 * 60 * 1000));
  }

  // Fetch all data for all APIs
  const results = await fetchWeatherData(geo, times);

  // Compute global yTemp range
  const yTempRange = getGlobalTempRange();

  // Cache the results
  dataCache.location = geoInput;
  dataCache.geo = geo;
  dataCache.times = times;
  dataCache.results = results;
  dataCache.yTempRange = yTempRange;
  dataCache.timestamp = Date.now();

  // Render charts with unified yTemp range and x axis (only for selected APIs)
  results.forEach(res => {
    if (res && res.value && res.value.data) {
      const { api, data, freshness } = res.value;
      // Only render if this API is in the selected sources
      if (checkedSources.includes(api.id)) {
        hideOverlay(api.id);
        renderChart(api.id, data, yTempRange, times);
        setForecastAge(api.id, freshness);
        setStatus(api.id, 'ok', 'live data');
      }
    }
  });

  // Render combined chart
  if (checkedSources.length > 0) {
    renderCombinedChart(checkedSources, yTempRange, times);
  }

  btn.disabled = false;
  btn.textContent = 'Fetch Forecasts';
  completeProgressBar();
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
let touchStartY = 0;

window.addEventListener('DOMContentLoaded', () => {
  // Initialize theme from localStorage
  initTheme();
  
  // Load version info
  loadVersionInfo();
  
  // Theme toggle button
  document.getElementById('themeToggle').addEventListener('click', cycleTheme);
  
  // Load all data on page open
  loadAll();
  
  // Fetch button click - force refresh
  document.getElementById('fetchBtn').addEventListener('click', () => {
    loadAll(true);  // Force refresh
  });
  
  // Enter to force refresh
  document.getElementById('cityInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadAll(true);  // Force refresh on Enter
  });
  
  // Slicer toggle listeners - just re-render, don't refetch
  document.querySelectorAll('.slicer-toggle').forEach(btn => {
    btn.addEventListener('click', function() {
      btn.classList.toggle('active');
      // Only re-render from cache, don't refetch
      if (dataCache.results) {
        renderChartsFromCache();
      }
    });
  });

  document.addEventListener('click', async event => {
    const statusPill = event.target.closest('.status-pill.ok[data-api-id]');
    if (statusPill) {
      openDataModal(statusPill.dataset.apiId);
      return;
    }

    if (event.target.id === 'closeDataModalBtn' || event.target.id === 'dataModal') {
      closeDataModal();
      return;
    }

    if (event.target.id === 'copyDataBtn') {
      const copyBtn = event.target;
      const text = copyBtn.dataset.clipboardText || '';
      if (!text) return;
      const originalLabel = copyBtn.textContent;
      try {
        await copyTextToClipboard(text);
        copyBtn.textContent = 'Copied';
      } catch (error) {
        copyBtn.textContent = 'Copy Failed';
      }
      setTimeout(() => {
        copyBtn.textContent = originalLabel;
      }, 1400);
    }
  });

  document.addEventListener('keydown', event => {
    const statusPill = event.target.closest('.status-pill.ok[data-api-id]');
    if (statusPill && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      openDataModal(statusPill.dataset.apiId);
      return;
    }
    if (event.key === 'Escape') {
      closeDataModal();
    }
  });
  
  // Pull-to-refresh: detect swipe down from top
  document.addEventListener('touchstart', e => {
    touchStartY = e.touches[0].clientY;
  });
  
  document.addEventListener('touchend', e => {
    const touchEndY = e.changedTouches[0].clientY;
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    
    // If at top of page and swiped down, refresh
    if (scrollTop === 0 && touchEndY - touchStartY > 100) {
      const btn = document.getElementById('fetchBtn');
      btn.textContent = 'Refreshing…';
      loadAll(true);  // Force refresh
    }
  });
});
</script>

    <button class="slicer-toggle" data-value="noaa">NOAA/NWS</button>
  </div>

  <div id="dataModal" class="data-modal" aria-hidden="true">
    <div class="data-modal-panel" role="dialog" aria-modal="true" aria-labelledby="dataModalTitle">
      <div class="data-modal-header">
        <div id="dataModalTitle" class="data-modal-title">Cached Weather Data</div>
        <div class="data-modal-actions">
          <button id="copyDataBtn" class="data-modal-btn" type="button">Copy to Clipboard</button>
          <button id="closeDataModalBtn" class="data-modal-btn" type="button">Close</button>
        </div>
      </div>
      <div id="dataModalBody" class="data-modal-body"></div>
    </div>
  </div>
  
  <div id="combinedChartPanel" style="max-width: 1400px; margin: 30px auto;">
    <div class="combined-chart-container">
      <h2 class="combined-chart-title">Combined Model Comparison</h2>
      <div class="chart-container" id="combinedChartContainer" style="height: 400px;">
        <canvas id="combinedChart"></canvas>
        <div class="loading-overlay" id="overlay-combined">
          <div class="spinner"></div>
          <div class="loading-text">Comparing models…</div>
        </div>
      </div>
      <div id="combinedLegend" style="padding: 20px 0 0 0; background: none; border: none; min-width: 200px; max-width: 100%; max-height: 80px; overflow-x: auto; display: flex; flex-wrap: wrap;"></div>
    </div>
  </div>
  
  <div id="mainGrid"></div>
  
  <div class="footer">
    <p>All data provided by free weather APIs. Zoom your browser to see more charts per row.</p>
    <p id="version-info" style="font-size: 0.75rem; color: var(--text-tertiary); margin-top: 10px;">Version: loading...</p>
  </div>
</body>
</html>
